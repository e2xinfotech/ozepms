name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is built and deployed by deploy.yml

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ozepms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, xml, curl, zip, gd, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        run: find app config database routes lang -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Front end type check and build
        run: npm ci && npm run build

      - name: Tests (runs when the tests folder is part of the repository)
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: ozepms_test
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          if [ -d tests ]; then
            cp .env.example .env && php artisan key:generate --no-interaction
            php artisan test
          else
            echo "No tests folder in this repository; skipping."
          fi
