# OzePMS on a shared Docker host (project "ozepms"): database, router, and two colours (blue / green) of the app.
# Visitors reach the "router"; the shared nginx-proxy (jwilder) in front forwards the two host names to it.
# Only one colour is live; deploy.sh starts the idle colour, checks it, then points the router at it.
name: ozepms

networks:
  default: {}
  proxy:
    external: true          # the existing network of nginx-proxy / letsencrypt companion (not modified)

volumes:
  db:
  storage:

x-app: &app
  env_file: [app.env]
  volumes:
    - storage:/var/www/html/storage
  networks: [default]
  restart: unless-stopped
  depends_on:
    db: { condition: service_healthy }

services:
  db:
    image: mysql:8.4
    container_name: ozepms-db
    env_file: [db.env]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-connections=200", "--innodb-buffer-pool-size=512M"]
    volumes:
      - db:/var/lib/mysql
    networks: [default]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  router:
    image: nginx:1.27-alpine
    container_name: ozepms-router
    volumes:
      - ./router/active.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [default, proxy]
    restart: unless-stopped
    environment:
      VIRTUAL_HOST: ${DOMAIN},${BOOKING_DOMAIN}
      VIRTUAL_PORT: "80"
      LETSENCRYPT_HOST: ${DOMAIN},${BOOKING_DOMAIN}
      LETSENCRYPT_EMAIL: ${LE_EMAIL}

  web_blue:
    <<: *app
    image: ${BLUE_IMAGE:-ozepms-app:none}
    container_name: ozepms-web-blue
    profiles: [blue]
  queue_blue:
    <<: *app
    image: ${BLUE_IMAGE:-ozepms-app:none}
    container_name: ozepms-queue-blue
    command: ["queue"]
    profiles: [blue]
  scheduler_blue:
    <<: *app
    image: ${BLUE_IMAGE:-ozepms-app:none}
    container_name: ozepms-scheduler-blue
    command: ["scheduler"]
    profiles: [blue]

  web_green:
    <<: *app
    image: ${GREEN_IMAGE:-ozepms-app:none}
    container_name: ozepms-web-green
    profiles: [green]
  queue_green:
    <<: *app
    image: ${GREEN_IMAGE:-ozepms-app:none}
    container_name: ozepms-queue-green
    command: ["queue"]
    profiles: [green]
  scheduler_green:
    <<: *app
    image: ${GREEN_IMAGE:-ozepms-app:none}
    container_name: ozepms-scheduler-green
    command: ["scheduler"]
    profiles: [green]
