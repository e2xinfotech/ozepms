# nginx inside the OzePMS container (plain HTTP on 8080; HTTPS is handled by the shared proxy in front).
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30;
    client_max_body_size 12m;
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Real client address comes from the proxy in front.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    server {
        listen 8080 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;
        charset utf-8;

        error_page 502 503 504 /errors/unavailable.html;
        location = /errors/unavailable.html { internal; add_header Cache-Control "no-store" always; }

        location ~ /\.(?!well-known) { return 404; }
        location ~ ^/index\.php(/.*)$ { return 301 $1$is_args$args; }
        location = /index.php { return 301 /$is_args$args; }
        location ~ \.php$ { return 404; }

        location ^~ /build/ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }
        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        location / { try_files $uri @app; }

        location @app {
            fastcgi_pass unix:/run/php-fpm.sock;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
            fastcgi_param SCRIPT_NAME /index.php;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            # The proxy in front terminates HTTPS and tells us so.
            fastcgi_param HTTPS $http_x_forwarded_proto_https;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }
    }

    map $http_x_forwarded_proto $http_x_forwarded_proto_https {
        default "";
        https on;
    }
}
