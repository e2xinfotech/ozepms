[www]
user = www-data
group = www-data
listen = /run/php-fpm.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660
; The container environment (database, keys, mail) must reach PHP.
clear_env = no
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
