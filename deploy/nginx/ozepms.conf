# OzePMS — Nginx site (Ubuntu, PHP-FPM 8.3)
# Install:  sudo cp deploy/nginx/ozepms.conf /etc/nginx/sites-available/ozepms.conf
#           sudo ln -s /etc/nginx/sites-available/ozepms.conf /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# Replace ozepms.e2xinfotech.in and /var/www/ozepms/current if yours differ.
# The booking engine has its own host name (book.…, set OZ_BOOKING_DOMAIN in .env): same site, same PHP-FPM;
# the application keeps the PMS screens closed on that host. Issue one certificate for both names.
# Certificates are issued by certbot (see docs/06-deployment.md).

# Rate limit for the sign-in and password endpoints (the application limits too).
limit_req_zone $binary_remote_addr zone=oz_auth:10m rate=20r/m;

upstream oz_php {
    server unix:/run/php/php8.3-fpm-ozepms.sock;
    keepalive 16;
}

# Plain HTTP: only Let's Encrypt challenges, everything else goes to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name ozepms.e2xinfotech.in book.ozepms.e2xinfotech.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ozepms.e2xinfotech.in book.ozepms.e2xinfotech.in;

    root /var/www/ozepms/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/ozepms.e2xinfotech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ozepms.e2xinfotech.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:oz_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # No server name/version in headers or error pages.
    server_tokens off;
    # Needs the "headers-more" module (apt install libnginx-mod-http-headers-more-filter);
    # remove the next two lines if it is not installed.
    more_clear_headers Server;
    more_clear_headers X-Powered-By;
    fastcgi_hide_header X-Powered-By;

    client_max_body_size 12m;
    client_body_timeout 30s;
    send_timeout 30s;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    access_log /var/log/nginx/ozepms.access.log;
    error_log  /var/log/nginx/ozepms.error.log warn;

    # Branded static pages when PHP itself is unavailable (application errors are rendered by the app).
    error_page 502 503 504 /errors/unavailable.html;
    location = /errors/unavailable.html {
        internal;
        root /var/www/ozepms/current/public;
        add_header Cache-Control "no-store" always;
    }

    # Hidden files (.env, .git …) never leave the server.
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Clean URLs only: /index.php/x → /x, and any other *.php request is "not found".
    location ~ ^/index\.php(/.*)$ {
        return 301 $1$is_args$args;
    }
    location = /index.php {
        return 301 /$is_args$args;
    }
    location ~ \.php$ {
        return 404;
    }

    # Built assets have content hashes in their names: cache for a year.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location /web-api/auth/ {
        limit_req zone=oz_auth burst=10 nodelay;
        limit_req_status 429;
        try_files $uri @app;
    }

    location / {
        try_files $uri @app;
    }

    # Every dynamic request is handed to the front controller internally;
    # the visitor never sees "index.php" or ".php".
    location @app {
        fastcgi_pass oz_php;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Errors from the application are shown by the application itself (custom error pages).
        fastcgi_intercept_errors off;
    }
}
