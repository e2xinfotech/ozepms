; OzePMS production PHP settings — /etc/php/8.3/fpm/conf.d/99-ozepms.ini (and cli/conf.d)
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC

; OPcache: the code only changes on deploy, so timestamps are not checked.
; Every deploy reloads PHP-FPM (see docs/06-deployment.md), which clears the cache.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.jit = tracing
opcache.jit_buffer_size = 64M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
