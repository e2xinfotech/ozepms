; OzePMS PHP-FPM pool — /etc/php/8.3/fpm/pool.d/ozepms.conf
[ozepms]
user = ozepms
group = www-data
listen = /run/php/php8.3-fpm-ozepms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
; Roughly: available RAM for PHP / 60 MB per worker.
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 1000
request_terminate_timeout = 75s

; Never reveal the PHP version.
php_admin_flag[expose_php] = off
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php/ozepms-fpm.log
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 10M
php_admin_value[post_max_size] = 12M
php_admin_value[session.cookie_httponly] = 1
php_admin_value[session.cookie_secure] = 1
